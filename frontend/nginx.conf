server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable in proxy_pass forces nginx to
    # re-resolve "backend" per request instead of caching the container IP at
    # startup — otherwise every Watchtower/compose recreate of the backend
    # (new IP) leaves nginx proxying to a dead address → permanent 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Vite fingerprints every bundle, so a file under /assets/ can never change
    # content without changing name. Cache it for a year and the browser stops
    # asking about it entirely.
    # One directive, not `expires` as well: each sets its own Cache-Control and
    # nginx would emit both, leaving the answer to whichever the browser reads.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html is the one file that must NEVER be cached: it is what points at
    # those fingerprinted bundles, so a stale copy pins the whole app to the
    # previous deploy. Without an explicit header nginx sends none, and the
    # browser falls back to heuristic caching — which is how a deploy can land,
    # be verifiably live, and still leave someone looking at the old build with
    # no way to tell. It cost us exactly that on 2026-07-31.
    #
    # Both routes into the app land here and so both get the header: a bare "/"
    # via the `index` directive, and a deep link like /payments via the SPA
    # fallback below — each is an internal redirect to /index.html, which
    # re-runs location matching.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API + health to the backend service
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /health {
        proxy_pass $backend_upstream;
    }
    location /openapi.json {
        proxy_pass $backend_upstream;
    }
    location /docs {
        proxy_pass $backend_upstream;
    }
}
