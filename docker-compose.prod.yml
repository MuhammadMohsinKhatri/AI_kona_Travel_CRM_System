# Production stack for a small VPS (Hostinger KVM 1/2/4 class).
#
#   cp backend/.env.example backend/.env   # then fill in real values
#
# The root .env selects how the app is exposed (see the `caddy` service):
#
#   On a domain, with HTTPS:        On an IP, sharing the box with
#                                   another ingress on 80/443:
#     DOMAIN=ops.example.com          (leave all three unset)
#     WEB_PORT=80                     -> http://<vps-ip>:8081
#     TLS_PORT=443
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Check what the variables resolved to before launching:
#   docker compose -f docker-compose.prod.yml config | grep -A3 -E 'DOMAIN|published'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: konaice
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-konaice}
      POSTGRES_DB: konaice
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konaice"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 160M

  backend:
    image: ghcr.io/muhammadmohsinkhatri/konaice-backend:latest
    build: ./backend   # local fallback: `up -d --build` still works without CI
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://konaice:${POSTGRES_PASSWORD:-konaice}@db:5432/konaice
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PIPELINE_RUN_INLINE: "false"
      ENVIRONMENT: production
      KONAOS_CACHE_DIR: /app/cache
    volumes:
      # session + brand caches shared with the worker, survive deploys
      - konaos_cache:/app/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    image: ghcr.io/muhammadmohsinkhatri/konaice-backend:latest
    build: ./backend
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: celery -A app.tasks.celery_app.celery worker --loglevel=info --concurrency=2
    # A pipeline run takes minutes; Docker's default grace period is TEN SECONDS.
    # So every Watchtower deploy SIGKILLed whatever was mid-run, and on a day
    # with a dozen pushes that is a dozen chances to kill a run — which is
    # exactly what happened on 2026-08-06, dying at "AI classification 9/18".
    #
    # SIGTERM starts Celery's warm shutdown: it stops taking new work and
    # finishes what it is holding. Five minutes is comfortably longer than a
    # run, so a deploy now waits for the run instead of killing it. It only
    # waits when something is actually in flight; an idle worker still exits
    # immediately.
    stop_grace_period: 300s
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://konaice:${POSTGRES_PASSWORD:-konaice}@db:5432/konaice
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      ENVIRONMENT: production
      KONAOS_CACHE_DIR: /app/cache
    volumes:
      - konaos_cache:/app/cache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 640M

  beat:
    image: ghcr.io/muhammadmohsinkhatri/konaice-backend:latest
    build: ./backend
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    command: celery -A app.tasks.celery_app.celery beat --loglevel=info
    env_file: ./backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # On a host where another stack owns 80/443 and reverse-proxies this
  # container BY NAME, the frontend also needs to sit on that ingress network —
  # see docker-compose.shared-ingress.yml, which must be passed alongside this
  # file for every compose command on such a host. Watchtower deploys carry the
  # attachment forward on their own; a manual `compose up` does not.
  frontend:
    image: ghcr.io/muhammadmohsinkhatri/konaice-frontend:latest
    build: ./frontend
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 64M

  # Auto-deploy: polls GHCR every 5 min; when CI publishes a new :latest it
  # pulls the image and recreates ONLY the services labeled watchtower.enable
  # (db/redis/caddy are never touched). Push to main = deployed in ~5-10 min.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      # Watchtower's client defaults to Docker API 1.25, which modern Docker
      # engines reject ("client version 1.25 is too old") — every poll then
      # fails and nothing ever auto-deploys. Force a current API version.
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # NOTE: images are pulled anonymously — the GHCR packages must be PUBLIC.
      # For private packages: `docker login ghcr.io` on the host, then add
      #   - /root/.docker/config.json:/config.json:ro
      # (only after the login — mounting a nonexistent file creates a directory)
    command: --label-enable --cleanup --interval 300
    deploy:
      resources:
        limits:
          memory: 64M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Two layouts, selected entirely from the root .env:
      #
      #  Own the standard ports (a box where nothing else holds them) — set
      #  WEB_PORT=80, TLS_PORT=443 and DOMAIN=ops.example.com. Caddy then gets a
      #  Let's Encrypt certificate on its own; both ports must be published for
      #  the ACME challenge to complete and for http:// to redirect to https://.
      #
      #  Share the box with another ingress (the KVM 2, where Traefik owns
      #  80/443) — leave all three unset. The defaults below keep konaice on its
      #  own host ports, reachable at http://<vps-ip>:8081, no TLS.
      - "${WEB_PORT:-8081}:80"
      - "${TLS_PORT:-8443}:443"
    environment:
      # A bare ":80" makes Caddy serve plain HTTP on any hostname and skip ACME
      # entirely; a hostname turns on automatic HTTPS. Defaulted here rather
      # than left to the Caddyfile because an empty DOMAIN is not a valid site
      # address — Caddy exits and the container crash-loops (fixed once in
      # 8aaa020, kept fixed by this default).
      DOMAIN: "${DOMAIN:-:80}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  konaos_cache:
